<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media | Bulbs</title>
  <meta name="description" content="Photos and videos from Bulbs — the band from Dublin.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/logos/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="media">

  <div class="grain" aria-hidden="true"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
    <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous">‹</button>
    <button class="lightbox-next" id="lightbox-next" aria-label="Next">›</button>
    <div class="lightbox-img-wrap"><img id="lightbox-img" src="" alt=""></div>
    <p class="lightbox-counter" id="lightbox-counter"></p>
  </div>

  <div class="nav-menu-mobile" id="mobile-menu">
    <a href="../shows/">Shows</a>
    <a href="../media/">Media</a>
    <a href="../merch/">Merch</a>
    <button class="btn btn-primary js-shop">Shop Now</button>
  </div>

  <nav class="site-nav scrolled" id="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../assets/images/uploads/bulbs.band-logo.jpg" alt="Bulbs" class="nav-logo-img">
      </a>
      <ul class="nav-links">
        <li><a href="../shows/">Shows</a></li>
        <li><a href="../media/" style="color:var(--text)">Media</a></li>
        <li><a href="../merch/">Merch</a></li>
      </ul>
      <a href="../merch/" class="nav-cta">Shop Now</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="page-hero">
    <div class="page-hero-inner">
      <span class="section-eyebrow">Photos & Video</span>
      <h1 class="page-hero-title">Media</h1>
    </div>
  </div>

  <!-- Tab toggle -->
  <div class="filter-bar">
    <div class="filter-bar-inner">
      <button class="filter-btn active" data-tab="photos">Photos</button>
      <button class="filter-btn" data-tab="videos">Videos</button>
    </div>
  </div>

  <!-- Photos -->
  <div class="media-page-wrap" id="media-photos-wrap">
    <div class="photo-masonry" id="photo-masonry"></div>
  </div>

  <!-- Videos -->
  <div class="media-page-wrap" id="media-videos-wrap" style="display:none">
    <div class="section-wrap">
      <div class="videos-grid" id="videos-grid"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-bottom" style="border-top:none;padding-top:0">
        <p class="footer-copy">© 2025 Bulbs. All rights reserved.</p>
        <a href="../index.html" class="footer-copy" style="color:var(--accent)">← Back to Home</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>

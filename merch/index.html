<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merch | Bulbs</title>
  <meta name="description" content="Official Bulbs merchandise — T-shirts, hoodies, records and more.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/logos/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="merch">

  <div class="grain" aria-hidden="true"></div>

  <div class="nav-menu-mobile" id="mobile-menu">
    <a href="../shows/">Shows</a>
    <a href="../media/">Media</a>
    <a href="../merch/">Merch</a>
    <button class="btn btn-primary js-shop">Shop Now</button>
  </div>

  <nav class="site-nav scrolled" id="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../assets/images/uploads/bulbs.band-logo.jpg" alt="Bulbs" class="nav-logo-img">
      </a>
      <ul class="nav-links">
        <li><a href="../shows/">Shows</a></li>
        <li><a href="../media/">Media</a></li>
        <li><a href="../merch/" style="color:var(--text)">Merch</a></li>
      </ul>
      <a href="#" class="nav-cta" id="merch-nav-shop">Shop Now</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="page-hero">
    <div class="page-hero-inner">
      <span class="section-eyebrow">Official Store</span>
      <h1 class="page-hero-title">Merch</h1>
      <p class="page-hero-sub">Ships worldwide. All orders support the band directly.</p>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-bar-inner">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="clothing">Clothing</button>
      <button class="filter-btn" data-filter="music">Music</button>
      <button class="filter-btn" data-filter="accessories">Accessories</button>
    </div>
  </div>

  <div class="merch-page-wrap">
    <div class="section-wrap">
      <div class="merch-grid" id="merch-grid"></div>
    </div>
  </div>

  <!-- External shop CTA -->
  <section class="shop-cta-section">
    <div class="section-wrap reveal">
      <p class="shop-cta-text">Looking for something else? Browse the full store.</p>
      <a href="#" class="btn btn-primary" id="shop-full-cta">Visit Full Store →</a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-bottom" style="border-top:none;padding-top:0">
        <p class="footer-copy">© 2025 Bulbs. All rights reserved.</p>
        <a href="../index.html" class="footer-copy" style="color:var(--accent)">← Back to Home</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
